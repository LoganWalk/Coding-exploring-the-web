<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mowing Business Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <style>

      :root {
        --dash-bg: #f3f5f1;
        --dash-surface: #ffffff;
        --dash-surface-soft: #f8faf7;
        --dash-border: #e2e8df;
        --dash-ink: #202b24;
        --dash-muted: #718076;
        --dash-green: #315b43;
        --dash-green-dark: #254734;
        --dash-green-soft: #edf3ed;
        --dash-danger: #a44343;
        --dash-danger-soft: #f9eeee;
        --dash-success: #36734b;
        --dash-success-soft: #edf5ef;
      }

      body.dashboard-page {
        min-height: 100vh;
        background: var(--dash-bg);
        color: var(--dash-ink);
      }

      .dashboard-page nav {
        background: var(--dash-surface);
        border-bottom: 1px solid var(--dash-border);
        box-shadow: 0 2px 10px rgba(31, 48, 37, .035);
      }

      .dashboard-page nav a {
        color: var(--dash-muted);
        border: 1px solid transparent;
      }

      .dashboard-page nav a:hover,
      .dashboard-page nav a:focus-visible {
        color: var(--dash-green);
        background: var(--dash-green-soft);
      }

      .dashboard-page nav a[style*="--accent"] {
        color: var(--dash-green-dark) !important;
        background: var(--dash-green-soft) !important;
        box-shadow: none;
      }

      .dashboard-page .content {
        max-width: 1440px;
        padding: 38px 42px 56px;
      }

      .dashboard-heading {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        margin-bottom: 28px;
      }

      .dashboard-heading h1 {
        margin: 0 0 5px;
        color: var(--dash-ink);
        font-family: "Sora", sans-serif;
        font-size: clamp(1.65rem, 3vw, 2rem);
        letter-spacing: -.035em;
      }

      .dashboard-subtitle {
        margin: 0;
        color: var(--dash-muted);
        font-size: .94rem;
      }

      .dashboard-stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
        margin: 0 0 28px;
      }

      .dashboard-stat {
        min-width: 0;
        padding: 21px 23px;
        background: var(--dash-surface);
        border: 1px solid var(--dash-border);
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(31, 48, 37, .035);
      }

      .dashboard-stat-label {
        display: block;
        margin-bottom: 10px;
        color: var(--dash-muted);
        font-size: .76rem;
        font-weight: 650;
        letter-spacing: .055em;
        text-transform: uppercase;
      }

      .dashboard-stat-value {
        display: block;
        color: var(--dash-green-dark);
        font-family: "Sora", sans-serif;
        font-size: clamp(1.55rem, 2.5vw, 1.9rem);
        font-weight: 650;
        line-height: 1.15;
        overflow-wrap: anywhere;
      }

      .dashboard-section {
        padding: 25px;
        background: var(--dash-surface);
        border: 1px solid var(--dash-border);
        border-radius: 13px;
        box-shadow: 0 2px 8px rgba(31, 48, 37, .035);
      }

      .dashboard-section-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 18px;
      }

      .dashboard-section-heading h2 {
        margin: 0;
        color: var(--dash-ink);
        font-family: "Sora", sans-serif;
        font-size: 1.18rem;
        letter-spacing: -.02em;
      }

      #directory-count {
        color: var(--dash-muted);
        font-size: .82rem;
        white-space: nowrap;
      }

      .directory-tools {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(180px, 230px);
        gap: 12px;
        margin-bottom: 20px;
        padding: 14px;
        background: var(--dash-surface-soft);
        border: 1px solid var(--dash-border);
        border-radius: 9px;
      }

      .directory-field { min-width: 0; }
      .directory-field label { display: none; }

      .directory-field input,
      .directory-field select {
        width: 100%;
        min-width: 0;
        min-height: 42px;
        padding: 9px 12px;
        color: var(--dash-ink);
        background: var(--dash-surface);
        border: 1px solid #d8e1d6;
        border-radius: 7px;
        font: inherit;
        font-size: .87rem;
      }

      .directory-field input::placeholder { color: #929d94; }

      .directory-field input:focus,
      .directory-field select:focus {
        outline: 2px solid rgba(70, 116, 82, .22);
        border-color: #78947d;
      }

      #clients-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 285px), 1fr));
        gap: 14px;
      }

      .dashboard-client-card {
        min-width: 0;
        padding: 17px 18px;
        background: var(--dash-surface);
        border: 1px solid var(--dash-border);
        border-radius: 9px;
        transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
      }

      .dashboard-client-card:hover {
        border-color: #b7c9b8;
        box-shadow: 0 5px 15px rgba(31, 48, 37, .055);
        transform: translateY(-1px);
      }

      .dashboard-client-card h3 {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 7px;
        margin: 0 0 13px;
        color: var(--dash-ink);
        font-family: "Sora", sans-serif;
        font-size: .96rem;
        font-weight: 650;
      }

      .dashboard-client-card dl {
        display: grid;
        grid-template-columns: 75px minmax(0, 1fr);
        gap: 7px 10px;
        margin: 0;
        font-size: .82rem;
      }

      .dashboard-client-card dt { color: var(--dash-muted); }
      .dashboard-client-card dd {
        min-width: 0;
        margin: 0;
        color: #35443a;
        overflow-wrap: anywhere;
      }

      .dashboard-client-card .client-quote {
        color: var(--dash-green);
        font-weight: 700;
      }

      .dashboard-page .map-link {
        color: var(--dash-green);
        text-decoration: none;
      }

      .dashboard-page .map-link:hover { text-decoration: underline; }

      .dashboard-page .paid-badge {
        margin-left: 2px;
        padding: 3px 7px;
        font-size: .64rem;
        letter-spacing: .025em;
      }

      .dashboard-page .paid-badge.paid {
        color: var(--dash-success);
        background: var(--dash-success-soft);
      }

      .dashboard-page .paid-badge.unpaid {
        color: var(--dash-danger);
        background: var(--dash-danger-soft);
      }

      .dashboard-empty,
      .dashboard-error {
        grid-column: 1 / -1;
        padding: 24px;
        color: var(--dash-muted);
        background: var(--dash-surface-soft);
        border: 1px dashed var(--dash-border);
        border-radius: 8px;
        text-align: center;
      }

      .dashboard-error {
        color: var(--dash-danger);
        background: var(--dash-danger-soft);
        border-color: #ecd4d4;
      }

      @media (max-width: 760px) {
        .dashboard-page .content { padding: 28px 22px 42px; }
        .dashboard-stats { gap: 12px; }
        .dashboard-stat { padding: 18px; }
        .dashboard-section { padding: 20px; }
      }

      @media (max-width: 560px) {
        .dashboard-page .content { padding: 24px 15px 36px; }
        .dashboard-stats { grid-template-columns: 1fr; gap: 10px; }
        .dashboard-stat { padding: 16px 18px; }
        .dashboard-stat-label { margin-bottom: 5px; }
        .directory-tools { grid-template-columns: 1fr; padding: 10px; }
        .dashboard-section { padding: 16px; }
        .dashboard-section-heading {
          align-items: flex-start;
          flex-direction: column;
          gap: 5px;
        }
      }

    </style>
  </head>
  <body class="dashboard-page">
    <nav>
      <a href="/" style="color: var(--accent); background: var(--accent-soft)">🏠 Dashboard</a>
      <a href="/revenue-page">💰 Revenue Analytics</a>
      <a href="/calendar-page">📅 Work Agenda</a>
      <a href="/client-page">🧑 Clients</a>
      <img id="image"
        src="https://mail.google.com/mail/u/0?ui=2&ik=c86d39d499&attid=0.1&permmsgid=msg-f:1873875814774685893&th=1a01582014d740c5&view=att&disp=safe&realattid=f_msytoggp0&zw"
        width="60" height="60" alt="Business logo" />
    </nav>

    <main class="content">
      <div class="dashboard-heading">
        <div>
          <h1>Business Dashboard</h1>
          <p class="dashboard-subtitle">A quick overview of your mowing business.</p>
        </div>
      </div>

      <section class="dashboard-stats" aria-label="Business overview">
        <article class="dashboard-stat">
          <span class="dashboard-stat-label">Total Clients</span>
          <strong class="dashboard-stat-value" id="total-clients">—</strong>
          
        </article>
        <article class="dashboard-stat">
          <span class="dashboard-stat-label">Recurring Clients</span>
          <strong class="dashboard-stat-value" id="recurring-clients">—</strong>
          
        </article>
        <article class="dashboard-stat">
          <span class="dashboard-stat-label">Outstanding Payments</span>
          <strong class="dashboard-stat-value" id="outstanding-payments">—</strong>
          
        </article>
      </section>

      <section class="dashboard-section">
        <div class="dashboard-section-heading">
          <h2>👥 Client Directory</h2>
          <span id="directory-count">Loading clients...</span>
        </div>
        <div class="directory-tools">
          <div class="directory-field">
            <label for="client-search">Search clients</label>
            <input id="client-search" type="search" placeholder="Search by name, address, or city..." autocomplete="off" />
          </div>
          <div class="directory-field">
            <label for="city-filter">Filter by city</label>
            <select id="city-filter">
              <option value="all">All cities</option>
            </select>
          </div>
        </div>
        <div id="clients-container" aria-live="polite">
          <div class="dashboard-empty">Loading your client directory...</div>
        </div>
      </section>
    </main>

    <script>
      const container = document.getElementById("clients-container");
      const searchInput = document.getElementById("client-search");
      const cityFilter = document.getElementById("city-filter");
      const directoryCount = document.getElementById("directory-count");
      let allClients = [];

      function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, (character) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        })[character]);
      }

      function paymentBadge(client) {
        const unpaidCount = Number(client.unpaid_count || 0);
        const jobCount = Number(client.job_count || 0);
        if (!jobCount) return "";
        if (unpaidCount > 0) {
          return '<span class="paid-badge unpaid" title="' + unpaidCount +
            ' unpaid job(s)">Owes $' + Number(client.unpaid_total || 0).toFixed(2) + '</span>';
        }
        return '<span class="paid-badge paid">Paid up</span>';
      }

      function mapsUrl(client) {
        const parts = [client.street_address, client.city, client.state, client.zip]
          .map((part) => String(part || "").trim()).filter(Boolean);
        return "https://www.google.com/maps/search/?api=1&query=" +
          encodeURIComponent(parts.join(", "));
      }

      function updateOverview(clients) {
        const recurring = clients.filter((client) =>
          String(client.reoccuring || "").trim().toLowerCase() === "yes"
        ).length;
        const unpaidTotal = clients.reduce((total, client) =>
          total + (Number(client.unpaid_total) || 0), 0
        );

        document.getElementById("total-clients").textContent = clients.length;
        document.getElementById("recurring-clients").textContent = recurring;
        document.getElementById("outstanding-payments").textContent =
          "$" + unpaidTotal.toFixed(2);
      }

      function populateCityFilter(clients) {
        const selectedCity = cityFilter.value;
        const cities = [...new Set(clients.map((client) =>
          String(client.city || "").trim()
        ).filter(Boolean))].sort((a, b) => a.localeCompare(b));

        cityFilter.innerHTML = '<option value="all">All cities</option>';
        cities.forEach((city) => {
          const option = document.createElement("option");
          option.value = city;
          option.textContent = city;
          cityFilter.appendChild(option);
        });

        if (cities.some((city) => city.toLowerCase() === selectedCity.toLowerCase())) {
          cityFilter.value = cities.find((city) =>
            city.toLowerCase() === selectedCity.toLowerCase()
          );
        } else {
          cityFilter.value = "all";
        }
      }

      function renderClients() {
        const query = searchInput.value.trim().toLowerCase();
        const city = cityFilter.value.toLowerCase();
        const filtered = allClients.filter((client) => {
          const matchesCity = city === "all" ||
            String(client.city || "").trim().toLowerCase() === city;
          const searchable = [
            client.first_name, client.last_name, client.additional_name,
            client.street_address, client.city, client.state, client.zip
          ].join(" ").toLowerCase();
          return matchesCity && searchable.includes(query);
        });

        directoryCount.textContent = "Showing " + filtered.length +
          " of " + allClients.length + " clients";

        if (filtered.length === 0) {
          container.innerHTML = '<div class="dashboard-empty">No clients match your search.</div>';
          return;
        }

        container.innerHTML = filtered.map((client) => {
          const first = escapeHTML(client.first_name);
          const last = escapeHTML(client.last_name);
          const additionalName = client.additional_name &&
            String(client.additional_name).toLowerCase() !== "none"
            ? " (" + escapeHTML(client.additional_name) + ")" : "";
          const address = escapeHTML(client.street_address);
          const cityName = escapeHTML(client.city);
          const state = escapeHTML(client.state);
          const zip = escapeHTML(client.zip);
          const frequency = escapeHTML(client.frequency);
          const recurring = String(client.reoccuring || "").toLowerCase() === "yes"
            ? "Recurring" : "One-time";
          const quote = Number(client.quote_price || 0);
          const safeMapUrl = mapsUrl(client);

          return `
            <article class="dashboard-client-card">
              <h3>${first} ${last}${additionalName} ${paymentBadge(client)}</h3>
              <dl>
                <dt>Address</dt>
                <dd><a class="map-link" href="${safeMapUrl}" target="_blank" rel="noopener">${address || "Not provided"}</a></dd>
                <dt>Location</dt>
                <dd>${cityName}, ${state} ${zip}</dd>
                <dt>Service</dt>
                <dd>${frequency || "Not set"} · ${recurring}</dd>
                <dt>Quote Price</dt>
                <dd class="client-quote">${Number.isFinite(quote) ? "$" + quote.toFixed(2) : "Not set"}</dd>
              </dl>
            </article>
          `;
        }).join("");
      }

      async function loadClients() {
        try {
          const response = await fetch("/api/clients/all");
          if (!response.ok) {
            throw new Error("Server returned " + response.status);
          }
          const data = await response.json();
          if (!Array.isArray(data)) {
            throw new Error("The server returned an unexpected client list.");
          }

          allClients = data;
          updateOverview(allClients);
          populateCityFilter(allClients);
          renderClients();
        } catch (error) {
          console.error("Could not load dashboard clients:", error);
          directoryCount.textContent = "Client data unavailable";
          container.innerHTML =
            '<div class="dashboard-error">Could not load your client data. Check that the server is running, then refresh the page.</div>';
        }
      }

      searchInput.addEventListener("input", renderClients);
      cityFilter.addEventListener("change", renderClients);
      loadClients();
    </script>
  </body>
</html>
