<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dart Outs Out Page</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <nav>
      <div class="circle-lines">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="buttons">
        <a href="/statistics-page" class="header" id="head3">📊 Statistics</a>
        <a href="/outs-page" class="selected" id="head2">🎯 Outs</a>
        <a href="/" class="header" id="head1">🏠 Dashboard</a>
      </div>
    </nav>

    <main class="content">
      <h1 class="page">🎯 Outs</h1>

      <!-- Step 1: out type -->
      <form action="/out-type" method="POST">
        <div id="button-box">
          <div>
            <button
              type="submit"
              id="double-out"
              name="out_type"
              value="double"
            >
              Double Out
            </button>
          </div>
          <div>
            <button
              type="submit"
              id="straight-out"
              name="out_type"
              value="straight"
            >
              Straight Out
            </button>
          </div>
        </div>
      </form>

      <!-- Step 2: starting number -->
      <form action="/first-num" method="POST">
        <div id="start-num-box" style="display: none">
          <label for="start">Enter your starting number</label>
          <input
            id="start"
            name="start"
            type="number"
            min="2"
            max="501"
            placeholder="Enter your starting number"
            required
          />
          <button type="submit" id="startSubmit">Submit</button>
        </div>
      </form>

      <!-- Steps 3-5: double out darts -->
      <div id="input-box-double">
        <form action="/first-dart-double" method="POST">
          <div id="double-box1" style="display: none">
            <label for="double-input1">Enter what you hit</label>
            <input id="double-input1" name="hitDouble1" required />
            <button type="submit" id="double-Submit1">Submit</button>
          </div>
        </form>
        <form action="/second-dart-double" method="POST">
          <div id="double-box2" style="display: none">
            <label for="double-input2">Enter what you hit</label>
            <input id="double-input2" name="hitDouble2" required />
            <button type="submit" id="double-Submit2">Submit</button>
          </div>
        </form>
        <form action="/third-dart-double" method="POST">
          <div id="double-box3" style="display: none">
            <label for="double-input3">Enter what you hit</label>
            <input id="double-input3" name="hitDouble3" required />
            <button type="submit" id="double-Submit3">Submit</button>
          </div>
        </form>
      </div>

      <!-- Steps 3-5: straight out darts -->
      <div id="input-box-straight">
        <form action="/first-dart-straight" method="POST">
          <div id="straight-box1" style="display: none">
            <label for="straight-input1">Enter what you hit</label>
            <input id="straight-input1" name="hitStraight1" required />
            <button type="submit" id="straight-Submit1">Submit</button>
          </div>
        </form>
        <form action="/second-dart-straight" method="POST">
          <div id="straight-box2" style="display: none">
            <label for="straight-input2">Enter what you hit</label>
            <input id="straight-input2" name="hitStraight2" required />
            <button type="submit" id="straight-Submit2">Submit</button>
          </div>
        </form>
        <form action="/third-dart-straight" method="POST">
          <div id="straight-box3" style="display: none">
            <label for="straight-input3">Enter what you hit</label>
            <input id="straight-input3" name="hitStraight3" required />
            <button type="submit" id="straight-Submit3">Submit</button>
          </div>
        </form>
      </div>
    </main>

    <script src="{{ url_for('static', filename='server.js') }}"></script>
  </body>
</html>
